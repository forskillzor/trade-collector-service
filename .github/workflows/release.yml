name: Release & Deploy

on:
  push:
    tags: ['v*']

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Run tests
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

      - name: Build shadowJar
        run: ./gradlew shadowJar --no-daemon

      - name: Prepare package
        run: |
          chmod +x scripts/prepare-package.sh
          ./scripts/prepare-package.sh "${{ github.ref_name }}"

      - name: Set tag output
        id: tag
        run: echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: trade-collector-*.tar.gz
          generate_release_notes: true

  deploy:
    needs: build-and-release
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Download and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.build-and-release.outputs.tag }}"
          ARCHIVE="trade-collector-${TAG}.tar.gz"

          echo "📥 Downloading $ARCHIVE from GitHub Release..."
          curl -fsSL --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -o "/tmp/$ARCHIVE" \
            "https://github.com/${{ github.repository }}/releases/download/$TAG/$ARCHIVE"

          echo "📤 Copying to VPS..."
          scp -i ~/.ssh/vps_key -o StrictHostKeyChecking=no "/tmp/$ARCHIVE" \
            $VPS_USER@$VPS_HOST:/tmp/

          echo "🚀 Running deploy-remote.sh..."
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST "
            sudo mkdir -p /opt/trade-collector && sudo chown -R \$USER:\$USER /opt/trade-collector || { echo '❌ Cannot init /opt/trade-collector — add deploy to sudoers'; exit 1; }
            cd /opt/trade-collector || exit 1
            tar -tzf /tmp/$ARCHIVE deploy-remote.sh >/dev/null 2>&1 || { echo '❌ Archive not valid gzip (likely HTML from GitHub — check GITHUB_TOKEN scope)'; head -c 200 /tmp/$ARCHIVE; exit 1; }
            tar -xzf /tmp/$ARCHIVE deploy-remote.sh
            bash deploy-remote.sh $TAG
          "

      - name: Verify
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST \
            "curl -sf --retry 3 --retry-delay 5 http://localhost:8080/health && echo 'Health OK'"
