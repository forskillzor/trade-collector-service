name: Deploy Collector Service

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

env:
  APP_NAME: trade-collector
  APP_USER: trader
  JAR_NAME: trade-collector.jar

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🔧 Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build shadowJar with Gradle
        run: ./gradlew shadowJar

      - name: Verify JAR file
        run: |
          echo "📦 Проверяем созданные JAR файлы:"
          find build/libs -name "*.jar" -type f
          
          # Проверяем что shadowJar создан
          SHADOW_JAR_PATH="build/libs/${JAR_NAME}"
          if [ -f "$SHADOW_JAR_PATH" ]; then
            echo "✅ Shadow JAR найден: $SHADOW_JAR_PATH"
            ls -lh "$SHADOW_JAR_PATH"
          else
            # Ищем любой jar с именем trade-collector
            JAR_FILE=$(find build/libs -name "*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -1)
            if [ -n "$JAR_FILE" ]; then
              echo "📦 Используем JAR: $JAR_FILE"
              cp "$JAR_FILE" "build/libs/${JAR_NAME}"
            else
              echo "❌ JAR файл не найден"
              exit 1
            fi
          fi

      - name: Prepare deployment package
        run: |
          mkdir -p deploy-package
          
          # Копируем shadowJar с фиксированным именем
          cp "build/libs/${JAR_NAME}" deploy-package/
          
          # Создаем базовый конфиг
          cat > deploy-package/config.json << 'EOF'
          {
            "server": {
              "port": 8080,
              "host": "0.0.0.0"
            },
            "database": {
              "url": "jdbc:postgresql://localhost:5432/trade_collector",
              "user": "trade_user",
              "driver": "org.postgresql.Driver"
            },
            "logging": {
              "level": "INFO"
            }
          }
          EOF
          
          # Создаем скрипт запуска для JVM
          cat > deploy-package/run.sh << 'EOF'
          #!/bin/bash
          cd /opt/trade-collector
          
          # JVM параметры из build.gradle.kts
          JVM_OPTS="--add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED"
          
          # Дополнительные параметры для мониторинга
          JVM_OPTS="$JVM_OPTS -XX:+UseG1GC"
          JVM_OPTS="$JVM_OPTS -Xmx512m"
          JVM_OPTS="$JVM_OPTS -Xms256m"
          JVM_OPTS="$JVM_OPTS -XX:MaxRAMPercentage=75.0"
          
          # Запуск JAR
          java $JVM_OPTS -jar trade-collector.jar --config config.json
          EOF
          chmod +x deploy-package/run.sh
          
          # Создаем systemd service файл для JVM
          cat > deploy-package/trade-collector.service << 'EOF'
          [Unit]
          Description=Trade Collector Service (JVM)
          After=network.target
          Wants=postgresql.service
          
          [Service]
          Type=simple
          User=trader
          Group=trader
          WorkingDirectory=/opt/trade-collector
          ExecStart=/opt/trade-collector/run.sh
          Restart=always
          RestartSec=10
          StandardOutput=append:/var/log/trade-collector/app.log
          StandardError=append:/var/log/trade-collector/error.log
          
          [Install]
          WantedBy=multi-user.target
          EOF
          
          echo "📁 Содержимое пакета деплоя:"
          ls -la deploy-package/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-jvm-package
          path: deploy-package/
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-jvm-package
          path: ./deploy-package

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to VPS
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          echo "🚀 Deploying to $VPS_HOST..."
          
          # Копируем файлы на сервер
          scp -i ~/.ssh/vps_key -r deploy-package/* $VPS_USER@$VPS_HOST:/tmp/deploy/
          
          # Выполняем установку
          ssh -i ~/.ssh/vps_key $VPS_USER@$VPS_HOST << 'EOF'
          set -e
          
          APP_NAME="trade-collector"
          APP_USER="trader"
          APP_DIR="/opt/\$APP_NAME"
          
          echo "=== Начало деплоя ==="
          
          # 1. Создаем пользователя
          if ! id "\$APP_USER" &>/dev/null; then
            sudo useradd -r -s /bin/false \$APP_USER
            echo "✅ Пользователь создан"
          fi
          
          # 2. Создаем директории
          sudo mkdir -p \$APP_DIR /var/log/\$APP_NAME
          
          # 3. Копируем файлы
          sudo cp /tmp/deploy/* \$APP_DIR/
          sudo chmod +x \$APP_DIR/run.sh
          
          # 4. Настраиваем systemd
          sudo cp \$APP_DIR/trade-collector.service /etc/systemd/system/
          sudo systemctl daemon-reload
          sudo systemctl enable \$APP_NAME
          
          # 5. Настраиваем права
          sudo chown -R \$APP_USER:\$APP_USER \$APP_DIR /var/log/\$APP_NAME
          
          # 6. Перезапускаем сервис
          sudo systemctl restart \$APP_NAME
          
          echo "✅ Деплой завершен"
          echo ""
          echo "📊 Проверяем статус..."
          sleep 5
          sudo systemctl status \$APP_NAME --no-pager | head -20
          EOF

      - name: Verify deployment
        run: |
          echo "🔍 Проверяем сервис..."
          sleep 30
          if curl -f -s --max-time 10 "http://${{ secrets.VPS_HOST }}:8080/health"; then
            echo "✅ Сервис работает!"
          else
            echo "❌ Сервис не отвечает"
            echo "Для диагностики выполните:"
            echo "ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'sudo journalctl -u trade-collector -n 50'"
            exit 1
          fi