name: Deploy Trade Collector
on:
  workflow_dispatch:
    inputs:
      tag_version:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

    steps:
      - name: 🔧 Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: 📥 Download release asset via GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag_version }}"
          ARCHIVE="trade-collector-${TAG}.tar.gz"
          echo "🔍 Looking for asset: $ARCHIVE in release $TAG"
          
          # Получаем ID релиза по тегу
          RELEASE_ID=$(curl -sSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG" \
            | jq -r '.id')
          
          if [[ "$RELEASE_ID" == "null" || -z "$RELEASE_ID" ]]; then
            echo "❌ Release not found for tag: $TAG"
            exit 1
          fi
          
          # Получаем URL ассета с нужным именем
          ASSET_URL=$(curl -sSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets" \
            | jq -r ".[] | select(.name == \"$ARCHIVE\") | .url")
          
          if [[ "$ASSET_URL" == "null" || -z "$ASSET_URL" ]]; then
            echo "❌ Asset '$ARCHIVE' not found in release $TAG"
            echo "Available assets:"
            curl -sSL -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets" | jq -r '.[].name'
            exit 1
          fi
          
          # Скачиваем ассет как бинарный поток
          curl -sSL \
            -H "Accept: application/octet-stream" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -o "/tmp/$ARCHIVE" \
            "$ASSET_URL"
          
          # Проверяем, что это действительно gzip
          if ! file "/tmp/$ARCHIVE" | grep -q "gzip compressed"; then
            echo "❌ Downloaded file is NOT a valid .tar.gz!"
            head -n 3 "/tmp/$ARCHIVE"
            exit 1
          fi
          
          echo "✅ Archive downloaded successfully"

      - name: 📤 Copy to VPS and deploy
        run: |
          TAG="${{ github.event.inputs.tag_version }}"
          scp -i ~/.ssh/vps_key "/tmp/trade-collector-${TAG}.tar.gz" \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/

          ssh -i ~/.ssh/vps_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            set -e
            cd /tmp
            rm -rf trade-collector-deploy
            mkdir trade-collector-deploy
            tar -xzf trade-collector-${TAG}.tar.gz -C trade-collector-deploy
            cd trade-collector-deploy

            export DB_PASSWORD='${{ secrets.DB_PASSWORD }}'
            export DB_HOST='${{ secrets.DB_HOST || 'localhost' }}'
            export DB_PORT='${{ secrets.DB_PORT || '5432' }}'
            export DB_USER='${{ secrets.DB_USER || 'trade_user' }}'
            export DB_NAME='${{ secrets.DB_NAME || 'trade_collector' }}'

            ./deploy-remote.sh
          name: Deploy Trade Collector
on:
  workflow_dispatch:
    inputs:
      tag_version:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

    steps:
      - name: 🔧 Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: 📥 Download release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag_version }}"
          ARCHIVE="trade-collector-${TAG}.tar.gz"
          echo "🔍 Downloading asset: $ARCHIVE"
          
          # Используем более простой подход через cURL
          curl -sL \
            -H "Accept: application/octet-stream" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -o "/tmp/$ARCHIVE" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/$( \
              curl -s \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG" \
                | jq -r '.assets[] | select(.name == "'"$ARCHIVE"'") | .id' \
            )"
          
          # Проверяем, что файл скачался
          if [ ! -s "/tmp/$ARCHIVE" ]; then
            echo "❌ Failed to download archive or file is empty"
            exit 1
          fi
          
          echo "✅ Archive downloaded successfully ($(ls -lh /tmp/$ARCHIVE | awk '{print $5}'))"
          
          # Проверяем что это tar.gz
          if ! tar -tzf "/tmp/$ARCHIVE" >/dev/null 2>&1; then
            echo "❌ Downloaded file is NOT a valid .tar.gz!"
            echo "File type: $(file "/tmp/$ARCHIVE")"
            exit 1
          fi
          
          echo "✅ Archive is valid tar.gz"

      - name: 📤 Copy to VPS and deploy
        run: |
          TAG="${{ github.event.inputs.tag_version }}"
          ARCHIVE="trade-collector-${TAG}.tar.gz"
          
          echo "🚀 Copying $ARCHIVE to VPS..."
          scp -i ~/.ssh/vps_key -o StrictHostKeyChecking=no "/tmp/$ARCHIVE" \
            $VPS_USER@$VPS_HOST:/tmp/
          
          echo "🔧 Deploying on VPS..."
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST << 'EOF'
            set -e
            echo "📦 Starting deployment..."
          
            # Создаем рабочую директорию
            DEPLOY_DIR="/tmp/trade-collector-deploy-$(date +%Y%m%d%H%M%S)"
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"
          
            # Распаковываем архив
            echo "📂 Extracting archive..."
            tar -xzf "/tmp/$ARCHIVE"
          
            # Экспортируем переменные окружения
            export DB_PASSWORD='${{ secrets.DB_PASSWORD }}'
            export DB_HOST='${{ secrets.DB_HOST || 'localhost' }}'
            export DB_PORT='${{ secrets.DB_PORT || '5432' }}'
            export DB_USER='${{ secrets.DB_USER || 'trade_user' }}'
            export DB_NAME='${{ secrets.DB_NAME || 'trade_collector' }}'
          
            echo "🔧 Running deploy-remote.sh..."
            echo "DB_HOST: $DB_HOST"
            echo "DB_PORT: $DB_PORT"
            echo "DB_USER: $DB_USER"
            echo "DB_NAME: $DB_NAME"
          
            # Делаем скрипт исполняемым и запускаем
            chmod +x deploy-remote.sh
            ./deploy-remote.sh
          
            echo "✅ Deployment completed successfully!"
          EOF"