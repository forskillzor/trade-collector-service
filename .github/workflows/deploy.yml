# .github/workflows/deploy.yml
name: Deploy Trade Collector

on:
  workflow_dispatch:
    inputs:
      tag_version:
        description: 'Версия релиза для деплоя (например: v1.0.0)'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_HOST: ${{ secrets.DB_HOST || 'localhost' }}
      DB_PORT: ${{ secrets.DB_PORT || '6432' }}
      DB_USER: ${{ secrets.DB_USER || 'trade_user' }}
      DB_NAME: ${{ secrets.DB_NAME || 'trade_collector' }}

    steps:
      - uses: actions/checkout@v4

      - name: 🔧 Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 📤 Copy deploy script to server
        run: |
          # Копируем локальную версию deploy-remote.sh на сервер
          scp -i ~/.ssh/vps_key scripts/deploy-remote.sh $VPS_USER@$VPS_HOST:/tmp/deploy-remote.sh
          ssh -i ~/.ssh/vps_key $VPS_USER@$VPS_HOST "chmod +x /tmp/deploy-remote.sh"

      - name: 🚀 Execute deployment on server
        run: |
          # Скачиваем deploy-remote.sh из релиза
          DEPLOY_SCRIPT_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.tag_version }}/deploy-remote.sh"
          
          ssh -i ~/.ssh/vps_key $VPS_USER@$VPS_HOST "
            # Скачиваем и запускаем скрипт деплоя из релиза
            curl -sL '$DEPLOY_SCRIPT_URL' -o /tmp/deploy-remote.sh
            chmod +x /tmp/deploy-remote.sh
          
            export RELEASE_TAG='${{ github.event.inputs.tag_version }}'
            export DB_PASSWORD='${{ secrets.DB_PASSWORD }}'
            export DB_HOST='${{ secrets.DB_HOST || 'localhost' }}'
            export DB_PORT='${{ secrets.DB_PORT || '6432' }}'
            export DB_USER='${{ secrets.DB_USER || 'trade_user' }}'
            export DB_NAME='${{ secrets.DB_NAME || 'trade_collector' }}'
          
            echo '🚀 Starting deployment of \$RELEASE_TAG...'
            /tmp/deploy-remote.sh
          "