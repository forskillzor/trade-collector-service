name: Deploy Trade Collector (JVM)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

env:
  APP_NAME: trade-collector
  APP_USER: trader
  JAR_NAME: trade-collector.jar

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🔧 Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build shadowJar
        run: ./gradlew shadowJar

      - name: Verify JAR exists
        run: |
          JAR_PATH="build/libs/${JAR_NAME}"
          if [ ! -f "$JAR_PATH" ]; then
            # Find any fat jar
            JAR_PATH=$(find build/libs -name "*-all.jar" -o -name "*-fat.jar" -o -name "*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -1)
            if [ -n "$JAR_PATH" ]; then
              cp "$JAR_PATH" "build/libs/${JAR_NAME}"
            else
              echo "❌ No JAR found"
              ls -la build/libs/
              exit 1
            fi
          fi
          echo "✅ JAR ready: $(ls -lh build/libs/${JAR_NAME})"

      - name: Prepare deployment package
        run: |
          mkdir -p deploy-package
          
          cp "build/libs/${JAR_NAME}" deploy-package/
          
          # Config
          if [ -f "config/production.json" ]; then
            cp config/production.json deploy-package/config.json
          else
            echo '{"server":{"port":8080,"host":"0.0.0.0"},"database":{"url":"jdbc:postgresql://localhost:5432/trade_collector","user":"trade_user","driver":"org.postgresql.Driver"},"logging":{"level":"INFO"}}' > deploy-package/config.json
          fi
          
          # systemd service
          cat > deploy-package/${{ env.APP_NAME }}.service <<EOF
          [Unit]
          Description=Trade Collector Service (JVM)
          After=network.target postgresql.service
          Requires=postgresql.service

          [Service]
          Type=simple
          User=${{ env.APP_USER }}
          Group=${{ env.APP_USER }}
          WorkingDirectory=/opt/${{ env.APP_NAME }}
          ExecStart=/usr/bin/java -Xmx512m -Xms256m -XX:+UseG1GC -XX:MaxRAMPercentage=75.0 --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED -jar ${{ env.JAR_NAME }} --config config.json
          Restart=always
          RestartSec=10
          StandardOutput=append:/var/log/${{ env.APP_NAME }}/app.log
          StandardError=append:/var/log/${{ env.APP_NAME }}/error.log

          [Install]
          WantedBy=multi-user.target
          EOF
  
          # SQL init
          if [ -f "001_init_schema.sql" ]; then
          cp 001_init_schema.sql deploy-package/
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-jvm-package
          path: deploy-package/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-jvm-package

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          scp -i ~/.ssh/vps_key -r ./* $VPS_USER@$VPS_HOST:/tmp/deploy/
          ssh -i ~/.ssh/vps_key $VPS_USER@$VPS_HOST <<'EOF'
          set -e
          APP_NAME="trade-collector"
          APP_USER="trader"
          APP_DIR="/opt/$APP_NAME"
          
          sudo mkdir -p $APP_DIR /var/log/$APP_NAME
          sudo cp /tmp/deploy/trade-collector.jar $APP_DIR/
          sudo cp /tmp/deploy/config.json $APP_DIR/ 2>/dev/null || true
          sudo cp /tmp/deploy/001_init_schema.sql /tmp/ 2>/dev/null || true
          sudo cp /tmp/deploy/trade-collector.service /etc/systemd/system/$APP_NAME.service
          
          sudo chown -R $APP_USER:$APP_USER $APP_DIR /var/log/$APP_NAME
          
          # DB setup
          if systemctl is-active --quiet postgresql; then
            sudo -u postgres psql -c "CREATE USER trade_user WITH PASSWORD '$DB_PASSWORD';" 2>/dev/null || true
            sudo -u postgres psql -c "CREATE DATABASE trade_collector OWNER trade_user;" 2>/dev/null || true
            if [ -f /tmp/001_init_schema.sql ]; then
              sudo -u postgres psql -d trade_collector -f /tmp/001_init_schema.sql 2>/dev/null || true
            fi
          fi
          
          sudo systemctl daemon-reload
          sudo systemctl enable $APP_NAME
          sudo systemctl restart $APP_NAME
          
          sleep 10
          if sudo systemctl is-active --quiet $APP_NAME; then
            echo "✅ Deploy successful"
          else
            sudo journalctl -u $APP_NAME -n 20 --no-pager
            exit 1
          fi
          EOF

      - name: Verify service
        run: |
          sleep 15
          if curl -f --max-time 10 "http://${{ secrets.VPS_HOST }}:8080/health"; then
            echo "✅ Service is up"
          else
            echo "❌ Service down"
            exit 1
          fi