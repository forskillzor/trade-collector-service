name: Deploy Collector Service

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

env:
  APP_NAME: trade-collector
  APP_USER: trader

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🔧 Install GraalVM with native-image
        uses: graalvm/setup-graalvm@v1
        with:
          version: '23.1.3'
          java-version: '17'
          components: 'native-image'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify GraalVM installation
        run: |
          java --version
          native-image --version

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: 🏗️ Build native image
        run: ./gradlew nativeCompile

      - name: Prepare deployment package
        run: |
          mkdir -p deploy-package
          
          # Проверяем, что native бинарник создан
          if [ -f "build/native/nativeCompile/trade-collector" ]; then
            echo "✅ Native binary found"
            cp build/native/nativeCompile/trade-collector deploy-package/
          else
            echo "❌ Native binary not found, listing build directory:"
            find build/ -type f -name "*trade*" 2>/dev/null || true
            exit 1
          fi
          
          # Копируем конфиг
          if [ -f "config/production.json" ]; then
            cp config/production.json deploy-package/config.json
            echo "✅ Config copied"
          else
            echo "⚠️ Config file not found"
          fi
          
          # Копируем скрипты если есть
          if [ -d "scripts" ]; then
            cp -r scripts deploy-package/ 2>/dev/null || true
            echo "✅ Scripts copied"
          fi
          
          # Копируем service файл если есть
          if [ -f "trade-collector.service" ]; then
            cp trade-collector.service deploy-package/
            echo "✅ Service file copied"
          else
            # Создаем базовый service файл
            cat > deploy-package/trade-collector.service << 'EOF'
          
          [Unit]
          Description=Trade Collector Service
          After=network.target postgresql.service
          Requires=postgresql.service
          
          [Service]
          Type=simple
          User=trader
          Group=trader
          WorkingDirectory=/opt/trade-collector
          ExecStart=/opt/trade-collector/trade-collector
          Restart=always
          RestartSec=10
          StandardOutput=append:/var/log/trade-collector/app.log
          StandardError=append:/var/log/trade-collector/error.log
          Environment="JAVA_OPTS=--add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED"
          
          [Install]
          WantedBy=multi-user.target
          EOF
          echo "✅ Service file created"
          fi
          
          # Копируем SQL схему если есть
          if [ -f "001_init_schema.sql" ]; then
          cp 001_init_schema.sql deploy-package/
          echo "✅ SQL schema copied"
          fi
          
          ls -la deploy-package/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-package
          path: deploy-package/
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-package
          path: ./deploy-package

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          echo "🚀 Deploying to $VPS_HOST..."
          
          # Создаем временную директорию
          rm -rf /tmp/deploy-files
          mkdir -p /tmp/deploy-files
          
          # Копируем все файлы из артефакта
          cp -r deploy-package/* /tmp/deploy-files/ 2>/dev/null || true
          
          # Копируем файлы на сервер
          scp -i ~/.ssh/vps_key -r /tmp/deploy-files/* $VPS_USER@$VPS_HOST:/tmp/deploy/ 2>/dev/null || echo "Some files might not have been copied"
          
          # Выполняем деплой скрипт на сервере
          ssh -i ~/.ssh/vps_key $VPS_USER@$VPS_HOST 'bash -s' << 'EOF'
          set -e
          
          APP_NAME="trade-collector"
          APP_USER="trader"
          APP_DIR="/opt/\$APP_NAME"
          
          echo "=== НАЧАЛО ДЕПЛОЯ ==="
          
          echo "👤 1. Проверка пользователя \$APP_USER..."
          if ! id "\$APP_USER" &>/dev/null; then
            echo "   📝 Создание пользователя \$APP_USER..."
            sudo useradd -r -s /bin/false \$APP_USER
          else
            echo "   ✅ Пользователь уже существует"
          fi
          
          echo "📁 2. Создание директорий..."
          sudo mkdir -p \$APP_DIR \
            /var/log/\$APP_NAME \
            /var/lib/\$APP_NAME/{aggregates,exports} \
            /var/backups/\$APP_NAME
          
          echo "📄 3. Копирование файлов..."
          if [ -f "/tmp/deploy/trade-collector" ]; then
            sudo cp /tmp/deploy/trade-collector \$APP_DIR/
            sudo chmod 755 \$APP_DIR/trade-collector
            echo "   ✅ Native binary скопирован"
          else
            echo "   ❌ Native binary не найден!"
            ls -la /tmp/deploy/ 2>/dev/null || true
            exit 1
          fi
          
          if [ -f "/tmp/deploy/config.json" ]; then
            sudo cp /tmp/deploy/config.json \$APP_DIR/
            echo "   ✅ Конфиг скопирован"
          fi
          
          echo "⚙️ 4. Настройка systemd..."
          if [ -f "/tmp/deploy/trade-collector.service" ]; then
            sudo cp /tmp/deploy/trade-collector.service /etc/systemd/system/\$APP_NAME.service
            echo "   ✅ Service файл скопирован"
          else
            echo "📝 Создание service файла..."
            sudo tee /etc/systemd/system/\$APP_NAME.service > /dev/null << SERVICE_EOF
          
          [Unit]
          Description=Trade Collector Service
          After=network.target postgresql.service
          Requires=postgresql.service

          [Service]
          Type=simple
          User=\$APP_USER
          Group=\$APP_USER
          WorkingDirectory=\$APP_DIR
          ExecStart=\$APP_DIR/trade-collector
          Restart=always
          RestartSec=10
          StandardOutput=append:/var/log/\$APP_NAME/app.log
          StandardError=append:/var/log/\$APP_NAME/error.log
          Environment="JAVA_OPTS=--add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED"

          [Install]
          WantedBy=multi-user.target
          SERVICE_EOF
          echo "   ✅ Service файл создан"
          fi

          echo "🔧 5. Настройка прав..."
          sudo chown -R \$APP_USER:\$APP_USER \$APP_DIR /var/lib/\$APP_NAME /var/log/\$APP_NAME

          echo "🗄️ 6. Настройка базы данных..."
          # Проверяем доступность PostgreSQL
          if systemctl is-active --quiet postgresql; then
          # Создаем пользователя БД если не существует
          sudo -u postgres psql -c "CREATE USER trade_user WITH PASSWORD '$DB_PASSWORD';" 2>/dev/null || echo "   ℹ️ Пользователь БД уже существует"
          sudo -u postgres psql -c "CREATE DATABASE trade_collector OWNER trade_user;" 2>/dev/null || echo "   ℹ️ База данных уже существует"

          # Применяем схему
          if [ -f "/tmp/deploy/001_init_schema.sql" ]; then
          echo "   📊 Применение схемы БД..."
          sudo -u postgres psql -d trade_collector -f /tmp/deploy/001_init_schema.sql 2>&1 | grep -v "уже существует" || true
          fi
          else
          echo "   ⚠️ PostgreSQL не запущен, пропускаем настройку БД"
          fi

          echo "🔄 7. Запуск сервиса..."
          sudo systemctl daemon-reload
          sudo systemctl enable \$APP_NAME
          sudo systemctl restart \$APP_NAME

          echo "⏳ 8. Ожидание запуска..."
          sleep 10

          echo "📊 9. Проверка статуса..."
          if sudo systemctl is-active --quiet \$APP_NAME; then
          echo "   ✅ Сервис запущен"
          sudo systemctl status \$APP_NAME --no-pager | head -20
          else
          echo "   ❌ Сервис не запущен"
          sudo journalctl -u \$APP_NAME -n 30 --no-pager
          exit 1
          fi

          echo "🌐 10. Проверка health check..."
          if curl -f -s --max-time 5 http://localhost:8080/health > /dev/null; then
          echo "   ✅ Health check пройден!"
          else
          echo "   ⚠️ Health check не пройден, проверка логов..."
          sudo journalctl -u \$APP_NAME -n 20 --no-pager
          exit 1
          fi

          echo "🎉 === ДЕПЛОЙ УСПЕШНО ЗАВЕРШЕН ==="
          EOF

      - name: Verify deployment
        run: |
          echo "Проверка удаленного сервиса..."
          sleep 30
          if curl -f -s --max-time 10 "http://${{ secrets.VPS_HOST }}:8080/health"; then
            echo "✅ Сервис работает на ${{ secrets.VPS_HOST }}:8080"
          else
            echo "❌ Сервис не отвечает на ${{ secrets.VPS_HOST }}:8080"
            echo "Проверьте логи на сервере: sudo journalctl -u trade-collector -n 50"
            exit 1
          fi