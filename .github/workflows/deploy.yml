name: Deploy Trade Collector

on:
  workflow_dispatch:
    inputs:
      tag_version:
        description: 'Версия релиза для деплоя (например: v1.0.0)'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      APP_NAME: trade-collector
      APP_USER: deploy
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_HOST: ${{ secrets.DB_HOST || 'localhost' }}
      DB_PORT: ${{ secrets.DB_PORT || '6432' }}
      DB_USER: ${{ secrets.DB_USER || 'trade_user' }}
      DB_NAME: ${{ secrets.DB_NAME || 'trade_collector' }}

    steps:
      # 0. Клонируем репозиторий для получения скриптов
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Загружаем релиз по тегу
      - name: Download release assets
        run: |
          echo "📦 Downloading release ${{ github.event.inputs.tag_version }}..."
          
          # Скачиваем JAR файл
          curl -L -o trade-collector.jar \
            "https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.tag_version }}/trade-collector.jar"
          
          # Скачиваем конфиг
          curl -L -o config.json \
            "https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.tag_version }}/config.json"
          
          # Создаем директорию для пакета
          mkdir -p deploy-package
          mv trade-collector.jar config.json deploy-package/

      # 2. Проверяем что загрузилось
      - name: Check downloaded package
        run: |
          echo "📦 Downloaded package contents:"
          ls -la deploy-package/
          
          # Проверяем необходимые файлы
          if [ ! -f "deploy-package/trade-collector.jar" ]; then
            echo "❌ ERROR: JAR file not found!"
            exit 1
          fi
          
          if [ ! -f "deploy-package/config.json" ]; then
            echo "❌ ERROR: config.json not found!"
            exit 1
          fi
          
          echo "✅ Package check passed"

      # 3. Настраиваем SSH (ИСПРАВЛЕНО!)
      - name: Setup SSH
        run: |
          echo "🔧 Setting up SSH..."
          mkdir -p ~/.ssh
          
          # Правильно сохраняем приватный ключ - строка за строкой
          echo "$VPS_SSH_KEY" | while IFS= read -r line; do
            echo "$line" >> ~/.ssh/vps_key
          done
          
          chmod 600 ~/.ssh/vps_key
          
          # Проверяем ключ
          echo "🔑 Checking SSH key format..."
          if ! ssh-keygen -l -f ~/.ssh/vps_key 2>/dev/null; then
            echo "❌ ERROR: Invalid SSH private key format"
            echo "First few chars of key:"
            head -c 100 ~/.ssh/vps_key
            exit 1
          fi
          
          # Добавляем хост в known_hosts
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "✅ SSH ready"

      # 4. Проверяем сервер (опционально)
      - name: Check server
        run: |
          echo "🔍 Checking server connection..."
          if ssh -i ~/.ssh/vps_key \
            -o ConnectTimeout=5 \
            -o StrictHostKeyChecking=no \
            "$VPS_USER@$VPS_HOST" \
            "echo '✅ Server is reachable'; \
             echo 'Java:'; java -version 2>&1 | head -1"; then
            echo "✅ Server check passed"
          else
            echo "⚠️ Server check failed, continuing anyway..."
          fi

      # 5. Деплой (ИСПРАВЛЕНО!)
      - name: Deploy to server
        run: |
          echo "🚀 Starting deployment to $VPS_HOST..."
          echo "📂 Current directory: $(pwd)"
          echo "📂 Scripts directory:"
          ls -la scripts/
          
          # Используем правильный путь к скрипту
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh

      # 6. Проверка деплоя
      - name: Verify deployment
        run: |
          echo "🔍 Verifying deployment..."
          chmod +x scripts/verify-deployment.sh
          ./scripts/verify-deployment.sh