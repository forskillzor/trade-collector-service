name: Deploy Trade Collector

on:
  workflow_dispatch:
    inputs:
      tag_version:
        description: 'Версия релиза для деплоя (например: v1.0.0)'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_HOST: ${{ secrets.DB_HOST || 'localhost' }}
      DB_PORT: ${{ secrets.DB_PORT || '6432' }}
      DB_USER: ${{ secrets.DB_USER || 'trade_user' }}
      DB_NAME: ${{ secrets.DB_NAME || 'trade_collector' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH
        run: |
          echo "🔧 Setting up SSH..."
          mkdir -p ~/.ssh
          
          # Сохраняем приватный ключ
          echo "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          
          # Проверяем ключ
          echo "🔑 Checking SSH key format..."
          if ! ssh-keygen -l -f ~/.ssh/vps_key 2>/dev/null; then
            echo "❌ ERROR: Invalid SSH private key format"
            exit 1
          fi
          
          # Добавляем хост в known_hosts
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "✅ SSH ready"

      - name: Deploy to server
        run: |
          echo "🚀 Deploying ${{ github.event.inputs.tag_version }} to $VPS_HOST"
          
          # Запускаем deploy.sh с аргументом - версией релиза
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh "${{ github.event.inputs.tag_version }}"