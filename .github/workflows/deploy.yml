name: Deploy Collector Service

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  APP_NAME: trade-collector
  APP_USER: trader
  JAR_NAME: trade-collector.jar

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🔧 Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build shadowJar
        run: |
          chmod +x gradlew
          ./gradlew shadowJar

      - name: Prepare package
        run: |
          mkdir -p deploy-package
          JAR_FILE=$(find build/libs -name "*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -1)
          cp "$JAR_FILE" deploy-package/trade-collector.jar
          
          cat > deploy-package/config.json << 'EOF'
          {
            "server": {
              "port": 8080,
              "host": "0.0.0.0"
            },
            "database": {
              "url": "jdbc:postgresql://localhost:5432/trade_collector",
              "user": "trade_user",
              "driver": "org.postgresql.Driver"
            },
            "logging": {
              "level": "INFO"
            }
          }
          EOF
          
          cat > deploy-package/run.sh << 'EOF'
          #!/bin/bash
          cd /opt/trade-collector
          
          JVM_OPTS="--add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED"
          JVM_OPTS="$JVM_OPTS -XX:+UseG1GC"
          JVM_OPTS="$JVM_OPTS -Xmx512m"
          JVM_OPTS="$JVM_OPTS -Xms256m"
          JVM_OPTS="$JVM_OPTS -XX:MaxRAMPercentage=75.0"
          
          java $JVM_OPTS -jar trade-collector.jar --config config.json
          EOF
          chmod +x deploy-package/run.sh
          
          cat > deploy-package/trade-collector.service << 'EOF'
          [Unit]
          Description=Trade Collector Service (JVM)
          After=network.target
          Wants=postgresql.service
          
          [Service]
          Type=simple
          User=trader
          Group=trader
          WorkingDirectory=/opt/trade-collector
          ExecStart=/opt/trade-collector/run.sh
          Restart=always
          RestartSec=10
          StandardOutput=append:/var/log/trade-collector/app.log
          StandardError=append:/var/log/trade-collector/error.log
          
          [Install]
          WantedBy=multi-user.target
          EOF
          
          echo "📦 Package contents:"
          ls -la deploy-package/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: trade-collector-package
          path: deploy-package/
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Передаем все секреты через env на уровне job
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: trade-collector-package
          path: ./deploy-package

      - name: Debug Secrets
        run: |
          echo "🔍 Проверяем секреты:"
          echo "VPS_HOST: [${VPS_HOST:0:10}...] (length: ${#VPS_HOST})"
          echo "VPS_USER: [$VPS_USER] (length: ${#VPS_USER})"
          echo "VPS_SSH_KEY: [${VPS_SSH_KEY:0:50}...] (length: ${#VPS_SSH_KEY})"
          echo "DB_PASSWORD: [${DB_PASSWORD:0:5}...] (length: ${#DB_PASSWORD})"
          
          if [ -z "$VPS_SSH_KEY" ]; then
            echo "❌ ERROR: VPS_SSH_KEY is empty!"
            exit 1
          fi
          if [ -z "$VPS_HOST" ]; then
            echo "❌ ERROR: VPS_HOST is empty!"
            exit 1
          fi
          if [ -z "$VPS_USER" ]; then
            echo "❌ ERROR: VPS_USER is empty!"
            exit 1
          fi

      - name: Setup SSH
        run: |
          echo "🔧 Setting up SSH connection..."
          
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/vps_key
          
          if [ ! -s ~/.ssh/vps_key ]; then
            echo "❌ SSH key file is empty!"
            exit 1
          fi
          
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          
          echo "✅ SSH configured for $VPS_USER@$VPS_HOST"

      - name: Deploy to server
        run: |
          echo "🚀 Deploying to $VPS_HOST..."
          
          # Copy files to server
          scp -i ~/.ssh/vps_key -r deploy-package/* "$VPS_USER@$VPS_HOST:/tmp/deploy/"
          
          # Execute deployment script
          ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" << 'EOF'
          set -e
          
          APP_NAME="trade-collector"
          APP_USER="trader"
          APP_DIR="/opt/\$APP_NAME"
          
          echo "=== STARTING DEPLOYMENT ==="
          
          # 1. Create user if not exists
          if ! id "\$APP_USER" &>/dev/null; then
            sudo useradd -r -s /bin/false "\$APP_USER"
            echo "✅ User created"
          fi
          
          # 2. Create directories
          sudo mkdir -p "\$APP_DIR" "/var/log/\$APP_NAME"
          
          # 3. Copy files
          sudo cp /tmp/deploy/trade-collector.jar "\$APP_DIR/"
          sudo cp /tmp/deploy/run.sh "\$APP_DIR/" 2>/dev/null || true
          sudo cp /tmp/deploy/config.json "\$APP_DIR/" 2>/dev/null || true
          sudo chmod +x "\$APP_DIR/run.sh" 2>/dev/null || true
          
          # 4. Setup systemd
          sudo cp /tmp/deploy/trade-collector.service /etc/systemd/system/
          sudo systemctl daemon-reload
          sudo systemctl enable "\$APP_NAME"
          
          # 5. Set permissions
          sudo chown -R "\$APP_USER:\$APP_USER" "\$APP_DIR" "/var/log/\$APP_NAME"
          
          # 6. Restart service
          sudo systemctl restart "\$APP_NAME"
          
          echo "✅ Deployment completed"
          echo ""
          echo "📊 Checking status..."
          sleep 3
          sudo systemctl status "\$APP_NAME" --no-pager | head -20
          EOF

      - name: Verify deployment
        run: |
          echo "🔍 Verifying service..."
          sleep 20
          
          MAX_RETRIES=3
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i/$MAX_RETRIES..."
            if curl -f -s --max-time 10 "http://$VPS_HOST:8080/health"; then
              echo "✅ Service is working!"
              exit 0
            fi
            sleep 10
          done
          
          echo "❌ Service is not responding"
          echo "For diagnostics run:"
          echo "ssh $VPS_USER@$VPS_HOST 'sudo journalctl -u trade-collector -n 50'"
          exit 1