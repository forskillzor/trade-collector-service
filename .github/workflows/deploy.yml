name: Deploy Trade Collector

on:
  workflow_dispatch:
    inputs:
      tag_version:
        description: 'Версия релиза для деплоя (например: v1.0.0)'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      APP_NAME: trade-collector
      APP_USER: deploy
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_HOST: ${{ secrets.DB_HOST || 'localhost' }}
      DB_PORT: ${{ secrets.DB_PORT || '6432' }}
      DB_USER: ${{ secrets.DB_USER || 'trade_user' }}
      DB_NAME: ${{ secrets.DB_NAME || 'trade_collector' }}

    steps:
      # 1. Загружаем релиз по тегу
      - name: Download release assets
        run: |
          echo "📦 Downloading release ${{ github.event.inputs.tag_version }}..."
          
          # Скачиваем JAR файл
          curl -L -o trade-collector.jar \
            "https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.tag_version }}/trade-collector.jar"
          
          # Скачиваем конфиг
          curl -L -o config.json \
            "https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.tag_version }}/config.json"
          
          # Создаем директорию для пакета
          mkdir -p deploy-package
          mv trade-collector.jar config.json deploy-package/

      # 2. Проверяем что загрузилось
      - name: Check downloaded package
        run: |
          echo "📦 Downloaded package contents:"
          ls -la deploy-package/
          
          # Проверяем необходимые файлы
          if [ ! -f "deploy-package/trade-collector.jar" ]; then
            echo "❌ ERROR: JAR file not found!"
            exit 1
          fi
          
          if [ ! -f "deploy-package/config.json" ]; then
            echo "❌ ERROR: config.json not found!"
            exit 1
          fi
          
          echo "✅ Package check passed"

      # 3. Настраиваем SSH
      - name: Setup SSH
        run: |
          echo "🔧 Setting up SSH..."
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "✅ SSH ready"

      # 4. Проверяем сервер (опционально)
      - name: Check server
        run: |
          echo "🔍 Checking server connection..."
          ssh -i ~/.ssh/vps_key \
            -o ConnectTimeout=5 \
            -o StrictHostKeyChecking=no \
            "$VPS_USER@$VPS_HOST" \
            "echo '✅ Server is reachable'; \
             echo 'Java:'; java -version 2>&1 | head -1"

      # 5. Деплой
      - name: Deploy to server
        run: |
          echo "🚀 Starting deployment to $VPS_HOST..."
          
          echo "📂 Current directory contents:"
          pwd
          ls -la
          
          echo "📂 scripts directory contents:"
          ls -la scripts/ 2>/dev/null || echo "scripts/ directory not found"
          
          echo "📂 deploy.sh availability:"
          find . -name "deploy.sh" -type f | head -5
          
          # Если deploy.sh не найден, создаем его inline
          if [ ! -f "scripts/deploy.sh" ]; then
            echo "📝 Creating deploy.sh from current directory..."
            echo '#!/bin/bash
          set -e
          
          echo "🚀 Deploying from GitHub Actions..."
          
          # Проверяем обязательные переменные
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ]; then
          echo "❌ ERROR: Missing required environment variables"
          exit 1
          fi
          
          echo "Deploying to $VPS_HOST..."
          
          # Настройка SSH
          SSH_KEY_FILE="$HOME/.ssh/vps_key"
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" | tr -d '\r' > "$SSH_KEY_FILE"
          chmod 600 "$SSH_KEY_FILE"
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          
          # Копируем файлы
          echo "📦 Copying files to server..."
          scp -i "$SSH_KEY_FILE" -r deploy-package/* "$VPS_USER@$VPS_HOST:/tmp/deploy/"
          
          # Выполняем деплой
          echo "🔄 Executing deployment script on server..."
          ssh -i "$SSH_KEY_FILE" "$VPS_USER@$VPS_HOST" "
          # Экспортируем переменные
          export DB_PASSWORD='$DB_PASSWORD'
          export DB_HOST='$DB_HOST'
          export DB_PORT='$DB_PORT'
          export DB_USER='$DB_USER'
          export DB_NAME='$DB_NAME'

          # Запускаем деплой
          cd /tmp/deploy
          chmod +x deploy-remote.sh
          ./deploy-remote.sh
          "

          echo "✅ Deployment completed!"' > deploy-temp.sh
          chmod +x deploy-temp.sh
          ./deploy-temp.sh
          else
          echo "✅ Using existing deploy.sh"
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh
          fi

      # 6. Проверка деплоя
      - name: Verify deployment
        run: |
          echo "🔍 Verifying deployment..."
          chmod +x scripts/verify-deployment.sh
          ./scripts/verify-deployment.sh