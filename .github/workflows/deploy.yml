# .github/workflows/build-and-deploy.yml
name: Build and Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build shadowJar
        run: |
          chmod +x gradlew
          ./gradlew shadowJar --no-daemon

      - name: Prepare package
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST || 'localhost' }}
          DB_PORT: ${{ secrets.DB_PORT || '6432' }}
          DB_USER: ${{ secrets.DB_USER || 'trade_user' }}
          DB_NAME: ${{ secrets.DB_NAME || 'trade_collector' }}
        run: |
          chmod +x scripts/prepare-package.sh
          ./scripts/prepare-package.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: trade-collector-package
          path: deploy-package/
          retention-days: 10

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            deploy-package/trade-collector.jar
            deploy-package/config.json
          generate_release_notes: true

  deploy:
    needs: build
    runs-on: ubuntu-latest

    env:
      APP_NAME: trade-collector
      APP_USER: deploy
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_HOST: ${{ secrets.DB_HOST || 'localhost' }}
      DB_PORT: ${{ secrets.DB_PORT || '6432' }}
      DB_USER: ${{ secrets.DB_USER || 'trade_user' }}
      DB_NAME: ${{ secrets.DB_NAME || 'trade_collector' }}

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: trade-collector-package
          path: ./deploy-package

      - name: Check downloaded package
        run: |
          echo "📦 Downloaded package contents:"
          ls -la deploy-package/
          
          if [ ! -f "deploy-package/trade-collector.jar" ]; then
            echo "❌ ERROR: JAR file not found!"
            exit 1
          fi
          
          if [ ! -f "deploy-package/config.json" ]; then
            echo "❌ ERROR: config.json not found!"
            exit 1
          fi
          
          echo "✅ Package check passed"

      - name: Setup SSH
        run: |
          echo "🔧 Setting up SSH..."
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "✅ SSH ready"

      - name: Check server
        run: |
          echo "🔍 Checking server connection..."
          ssh -i ~/.ssh/vps_key \
            -o ConnectTimeout=5 \
            -o StrictHostKeyChecking=no \
            "$VPS_USER@$VPS_HOST" \
            "echo '✅ Server is reachable'; \
             echo 'Java:'; java -version 2>&1 | head -1"

      - name: Deploy to server
        run: |
          echo "🚀 Starting deployment to $VPS_HOST..."
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh

      - name: Verify deployment
        run: |
          echo "🔍 Verifying deployment..."
          chmod +x scripts/verify-deployment.sh
          ./scripts/verify-deployment.sh