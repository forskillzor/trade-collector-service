name: Deploy Collector Service

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  APP_NAME: trade-collector
  APP_USER: deploy
  JAR_NAME: trade-collector.jar

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🔧 Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build shadowJar
        run: |
          chmod +x gradlew
          ./gradlew shadowJar

      - name: Prepare package
        run: |
          mkdir -p deploy-package
          JAR_FILE=$(find build/libs -name "*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -1)
          cp "$JAR_FILE" deploy-package/trade-collector.jar
          
          cat > deploy-package/config.json << 'EOF'
          {
            "server": {
              "port": 8080,
              "host": "0.0.0.0"
            },
            "database": {
              "url": "jdbc:postgresql://localhost:5432/trade_collector",
              "user": "trade_user",
              "driver": "org.postgresql.Driver"
            },
            "logging": {
              "level": "INFO"
            }
          }
          EOF
          
          cat > deploy-package/run.sh << 'EOF'
          #!/bin/bash
          cd /opt/trade-collector
          
          JVM_OPTS="--add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED"
          JVM_OPTS="$JVM_OPTS -XX:+UseG1GC"
          JVM_OPTS="$JVM_OPTS -Xmx512m"
          JVM_OPTS="$JVM_OPTS -Xms256m"
          JVM_OPTS="$JVM_OPTS -XX:MaxRAMPercentage=75.0"
          
          java $JVM_OPTS -jar trade-collector.jar --config config.json
          EOF
          chmod +x deploy-package/run.sh
          
          cat > deploy-package/trade-collector.service << 'EOF'
          [Unit]
          Description=Trade Collector Service (JVM)
          After=network.target
          Wants=postgresql.service
          
          [Service]
          Type=simple
          User=trader
          Group=trader
          WorkingDirectory=/opt/trade-collector
          ExecStart=/opt/trade-collector/run.sh
          Restart=always
          RestartSec=10
          StandardOutput=append:/var/log/trade-collector/app.log
          StandardError=append:/var/log/trade-collector/error.log
          
          [Install]
          WantedBy=multi-user.target
          EOF
          
          echo "📦 Package contents:"
          ls -la deploy-package/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: trade-collector-package
          path: deploy-package/
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Передаем все секреты через env на уровне job
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: trade-collector-package
          path: ./deploy-package

      - name: Debug Secrets
        run: |
          echo "🔍 Проверяем секреты:"
          echo "VPS_HOST: [${VPS_HOST:0:10}...] (length: ${#VPS_HOST})"
          echo "VPS_USER: [$VPS_USER] (length: ${#VPS_USER})"
          echo "VPS_SSH_KEY: [${VPS_SSH_KEY:0:50}...] (length: ${#VPS_SSH_KEY})"
          echo "DB_PASSWORD: [${DB_PASSWORD:0:5}...] (length: ${#DB_PASSWORD})"
          
          if [ -z "$VPS_SSH_KEY" ]; then
            echo "❌ ERROR: VPS_SSH_KEY is empty!"
            exit 1
          fi
          if [ -z "$VPS_HOST" ]; then
            echo "❌ ERROR: VPS_HOST is empty!"
            exit 1
          fi
          if [ -z "$VPS_USER" ]; then
            echo "❌ ERROR: VPS_USER is empty!"
            exit 1
          fi
      - name: Debug All Variables
        run: |
          echo "=== DEBUG ALL VARIABLES ==="
          echo "Environment variables:"
          env | grep -E "(VPS|SSH|DB)" || true
          echo ""
          echo "Testing variable substitution:"
          echo "VPS_HOST = '$VPS_HOST'"
          echo "VPS_USER = '$VPS_USER'"
          echo "VPS_SSH_KEY exists = $([ -n "$VPS_SSH_KEY" ] && echo "YES (${#VPS_SSH_KEY} chars)" || echo "NO")"
          echo "VPS_SSH_KEY first 100 chars = '${VPS_SSH_KEY:0:100}'"
          echo "DB_PASSWORD exists = $([ -n "$DB_PASSWORD" ] && echo "YES (${#DB_PASSWORD} chars)" || echo "NO")"
          echo "=== END DEBUG ==="

      - name: Setup SSH
        run: |
          echo "🔧 Setting up SSH connection..."
          
          mkdir -p ~/.ssh
          
          # Способ 1: Просто echo (самый простой)
          echo "$VPS_SSH_KEY" > ~/.ssh/vps_key
          
          # Способ 2: Если есть проблемы с переносами строк
          echo "Writing SSH key..."
          # Убедимся что ключ записан
          if [ -z "$VPS_SSH_KEY" ]; then
            echo "❌ VPS_SSH_KEY is empty!"
            exit 1
          fi
          
          # Записываем ключ
          echo "$VPS_SSH_KEY" > ~/.ssh/vps_key
          
          # Проверяем что файл создан
          if [ ! -f ~/.ssh/vps_key ]; then
            echo "❌ Failed to create SSH key file!"
            exit 1
          fi
          
          echo "First 3 lines of key file:"
          head -3 ~/.ssh/vps_key
          
          # Проверяем формат
          FIRST_LINE=$(head -1 ~/.ssh/vps_key)
          echo "First line: '$FIRST_LINE'"
          
          if [[ "$FIRST_LINE" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then
            echo "✅ SSH key format: OpenSSH private key"
          elif [[ "$FIRST_LINE" == *"BEGIN RSA PRIVATE KEY"* ]]; then
            echo "✅ SSH key format: RSA private key"
          elif [[ "$FIRST_LINE" == *"ssh-"* ]]; then
            echo "❌ Это публичный ключ, а нужен приватный!"
            echo "В секрете VPS_SSH_KEY должен быть приватный ключ, который начинается с:"
            echo "-----BEGIN OPENSSH PRIVATE KEY-----"
            echo "или"
            echo "-----BEGIN RSA PRIVATE KEY-----"
            exit 1
          else
            echo "❌ Неизвестный формат ключа"
            echo "Полное содержимое ключа:"
            cat ~/.ssh/vps_key
            exit 1
          fi
          
          chmod 600 ~/.ssh/vps_key
          
          # Добавляем хост в known_hosts
          echo "Adding $VPS_HOST to known_hosts..."
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          
          echo "✅ SSH setup complete"

      - name: Deploy to server
        env:
          SUDO_PASSWORD: ${{ secrets.SUDO_PASSWORD }}  # Добавь этот секрет в GitHub!
        run: |
          echo "🚀 Deploying to $VPS_HOST..."
          
          scp -i ~/.ssh/vps_key -r deploy-package/* "$VPS_USER@$VPS_HOST:/tmp/deploy/"
          
          ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" << EOF
          set -e
          
          APP_NAME="trade-collector"
          APP_USER="trader"
          APP_DIR="/opt/\$APP_NAME"
          
          echo "=== STARTING DEPLOYMENT ==="
          
          # Используем sudo -S для чтения пароля из stdin
          echo "$SUDO_PASSWORD" | sudo -S useradd -r -s /bin/false "\$APP_USER" 2>/dev/null || echo "User may already exist"
          
          echo "$SUDO_PASSWORD" | sudo -S mkdir -p "\$APP_DIR" "/var/log/\$APP_NAME"
          echo "$SUDO_PASSWORD" | sudo -S cp /tmp/deploy/trade-collector.jar "\$APP_DIR/"
          [ -f "/tmp/deploy/run.sh" ] && echo "$SUDO_PASSWORD" | sudo -S cp /tmp/deploy/run.sh "\$APP_DIR/"
          [ -f "/tmp/deploy/config.json" ] && echo "$SUDO_PASSWORD" | sudo -S cp /tmp/deploy/config.json "\$APP_DIR/"
          [ -f "\$APP_DIR/run.sh" ] && echo "$SUDO_PASSWORD" | sudo -S chmod +x "\$APP_DIR/run.sh"
          
          echo "$SUDO_PASSWORD" | sudo -S cp "\$APP_DIR/trade-collector.service" /etc/systemd/system/
          echo "$SUDO_PASSWORD" | sudo -S chown -R "\$APP_USER:\$APP_USER" "\$APP_DIR" "/var/log/\$APP_NAME"
          
          echo "$SUDO_PASSWORD" | sudo -S systemctl daemon-reload
          echo "$SUDO_PASSWORD" | sudo -S systemctl enable "\$APP_NAME"
          echo "$SUDO_PASSWORD" | sudo -S systemctl restart "\$APP_NAME"
          
          echo "✅ Deployment completed"
          
          echo "📊 Checking status..."
          sleep 3
          echo "$SUDO_PASSWORD" | sudo -S systemctl status "\$APP_NAME" --no-pager | head -20
          EOF
      - name: Verify deployment
        run: |
          echo "🔍 Verifying service..."
          sleep 20
          
          MAX_RETRIES=3
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i/$MAX_RETRIES..."
            if curl -f -s --max-time 10 "http://$VPS_HOST:8080/health"; then
              echo "✅ Service is working!"
              exit 0
            fi
            sleep 10
          done
          
          echo "❌ Service is not responding"
          echo "For diagnostics run:"
          echo "ssh $VPS_USER@$VPS_HOST 'sudo journalctl -u trade-collector -n 50'"
          exit 1