name: Deploy Trade Collector

on:
  workflow_dispatch:
    inputs:
      tag_version:
        description: 'Версия релиза для деплоя (например: v1.0.0)'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_HOST: ${{ secrets.DB_HOST || 'localhost' }}
      DB_PORT: ${{ secrets.DB_PORT || '6432' }}
      DB_USER: ${{ secrets.DB_USER || 'trade_user' }}
      DB_NAME: ${{ secrets.DB_NAME || 'trade_collector' }}

    steps:
      - uses: actions/checkout@v4

      - name: 🔧 Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 📤 Stream release files directly to server without storing token there
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_URL="https://api.github.com/repos/${{ github.repository }}/releases/download/${{ github.event.inputs.tag_version }}"
          
          FILES=(
            "trade-collector.jar"
            "config.json"
            "deploy-remote.sh"
            "trade-collector.service"
            "run.sh"
            "init-database.sh"
            "001_init_schema.sql"
          )
          
          ssh -i ~/.ssh/vps_key $VPS_USER@$VPS_HOST "mkdir -p /tmp/release"
          
          for file in "${FILES[@]}"; do
            echo "Uploading $file to server..."
            curl -sL -H "Authorization: Bearer $GITHUB_TOKEN" \
                 "$RELEASE_URL/$file" | \
              ssh -i ~/.ssh/vps_key $VPS_USER@$VPS_HOST "cat > /tmp/release/$file" || \
              echo "⚠️ Could not upload $file"
          done
          
          echo "📦 All files uploaded to server."

      - name: 🚀 Execute deployment on server
        run: |
          ssh -i ~/.ssh/vps_key $VPS_USER@$VPS_HOST "
            # Скрипт УЖЕ скопирован через scp на предыдущем шаге
            # Просто запускаем его
          
            cd /tmp/release
            chmod +x /tmp/release/deploy-remote.sh
          
            export RELEASE_TAG='${{ github.event.inputs.tag_version }}'
            export DB_PASSWORD='${{ secrets.DB_PASSWORD }}'
            export DB_HOST='${{ secrets.DB_HOST || 'localhost' }}'
            export DB_PORT='${{ secrets.DB_PORT || '5432' }}'
            export DB_USER='${{ secrets.DB_USER || 'trade_user' }}'
            export DB_NAME='${{ secrets.DB_NAME || 'trade_collector' }}'
          
            echo '🚀 Starting deployment of \$RELEASE_TAG...'
            /tmp/deploy-remote.sh
          "