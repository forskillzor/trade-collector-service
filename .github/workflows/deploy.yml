name: Deploy

on:
  workflow_dispatch:
    inputs:
      tag_version:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Download release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag_version }}"
          ARCHIVE="trade-collector-${TAG}.tar.gz"
          echo "🔍 Downloading asset: $ARCHIVE"

          ASSET_ID=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG" \
            | jq -r '.assets[] | select(.name == "'"$ARCHIVE"'") | .id')

          if [ -z "$ASSET_ID" ] || [ "$ASSET_ID" = "null" ]; then
            echo "❌ Asset not found in release $TAG"
            echo "Available assets:"
            curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG" \
              | jq -r '.assets[].name'
            exit 1
          fi

          curl -sL \
            -H "Accept: application/octet-stream" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -o "/tmp/$ARCHIVE" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/$ASSET_ID"

          if [ ! -s "/tmp/$ARCHIVE" ]; then
            echo "❌ Failed to download archive or file is empty"
            exit 1
          fi

          echo "✅ Archive downloaded ($(ls -lh /tmp/$ARCHIVE | awk '{print $5}'))"

          if ! tar -tzf "/tmp/$ARCHIVE" >/dev/null 2>&1; then
            echo "❌ Downloaded file is NOT a valid .tar.gz!"
            exit 1
          fi

          echo "✅ Archive is valid tar.gz"

      - name: Copy to VPS and deploy
        run: |
          TAG="${{ github.event.inputs.tag_version }}"
          ARCHIVE="trade-collector-${TAG}.tar.gz"

          echo "📤 Copying $ARCHIVE to VPS..."
          scp -i ~/.ssh/vps_key -o StrictHostKeyChecking=no "/tmp/$ARCHIVE" \
            $VPS_USER@$VPS_HOST:/tmp/

          echo "🚀 Deploying on VPS..."
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST << 'EOF'
          set -e

          TAG="${{ github.event.inputs.tag_version }}"
          ARCHIVE="trade-collector-${TAG}.tar.gz"

          DEPLOY_DIR="/tmp/trade-collector-deploy-$(date +%Y%m%d%H%M%S)"
          mkdir -p "$DEPLOY_DIR"
          cd "$DEPLOY_DIR"

          echo "📂 Extracting $ARCHIVE..."
          tar -xzf "/tmp/$ARCHIVE"

          export DB_PASSWORD='${{ secrets.DB_PASSWORD }}'
          export DB_HOST='${{ secrets.DB_HOST || 'localhost' }}'
          export DB_PORT='${{ secrets.DB_PORT || '5432' }}'
          export DB_USER='${{ secrets.DB_USER || 'trade_user' }}'
          export DB_NAME='${{ secrets.DB_NAME || 'trade_collector' }}'

          echo "🔧 Running deploy-remote.sh..."
          chmod +x deploy-remote.sh
          ./deploy-remote.sh "$TAG"

          rm -rf "$DEPLOY_DIR"
          echo "✅ Deployment completed!"
          EOF
