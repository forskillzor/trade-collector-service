name: Deploy Trade Collector

on:
  workflow_dispatch:
    inputs:
      tag_version:
        description: 'Версия релиза для деплоя (например: v1.0.0)'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_HOST: ${{ secrets.DB_HOST || 'localhost' }}
      DB_PORT: ${{ secrets.DB_PORT || '6432' }}
      DB_USER: ${{ secrets.DB_USER || 'trade_user' }}
      DB_NAME: ${{ secrets.DB_NAME || 'trade_collector' }}

    steps:
      - uses: actions/checkout@v4

      - name: 🔧 Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 📥 Download release files to runner, then copy to server
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Используем bash для удаления пробелов в начале и конце
          INPUT_TAG_VERSION="${{ github.event.inputs.tag_version }}"
          STRIPPED_TAG_VERSION=$(echo "$INPUT_TAG_VERSION" | xargs)  # xargs удаляет leading/trailing spaces

          # Формируем URL
          RELEASE_URL="https://api.github.com/repos/${{ github.repository }}/releases/download/$STRIPPED_TAG_VERSION"

          # Выводим отладочную информацию
          echo "🔍 DEBUG: Repository = ${{ github.repository }}"
          echo "🏷️ DEBUG: Input Tag Version (raw) = '${{ github.event.inputs.tag_version }}'"
          echo "🔗 DEBUG: Input Tag Version (stripped) = '$STRIPPED_TAG_VERSION'"
          echo "🔗 DEBUG: Full RELEASE_URL base = '$RELEASE_URL'"          
          
          FILES=(
            "trade-collector.jar"
            "config.json"
            "deploy-remote.sh"
            "trade-collector.service"
            "run.sh"
            "init-database.sh"
            "001_init_schema.sql"
          )
          
          # Создаём локальную директорию на runner
          mkdir -p /tmp/release_runner
          
          # Скачиваем каждый файл
          for file in "${FILES[@]}"; do
            echo "📥 Downloading $file to runner..."
            if curl -sL -f -H "Authorization: token $GITHUB_TOKEN" \
                 -o "/tmp/release_runner/$file" \
                 "$RELEASE_URL/$file"; then
              echo "✅ Downloaded $file locally on runner"
            else
              echo "❌ Failed to download $file locally on runner"
              # Покажем, что именно вернул GitHub в случае ошибки
              echo "🔍 Debug response for $file:"
              curl -sL -H "Authorization: token $GITHUB_TOKEN" "$RELEASE_URL/$file" | head -c 500
              echo ""
              exit 1  # Останавливаем выполнение, если один из файлов не скачался
            fi
          done
          
          # Проверим, что файлы действительно есть
          echo "📁 Contents of /tmp/release_runner/:"
          ls -la /tmp/release_runner/
          
          # Копируем всё содержимое локальной директории на сервер
          echo "📤 Copying files from runner to server..."
          scp -i ~/.ssh/vps_key -r /tmp/release_runner/* $VPS_USER@$VPS_HOST:/tmp/release/
          
          echo "✅ All files copied to server."

      - name: 📦 Download source code archive and extract scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Удаляем возможные пробелы в теге
          INPUT_TAG_VERSION="${{ github.event.inputs.tag_version }}"
          STRIPPED_TAG_VERSION=$(echo "$INPUT_TAG_VERSION" | xargs)
          
          # URL к архиву с исходным кодом (tar.gz)
          ARCHIVE_URL="https://api.github.com/repos/${{ github.repository }}/tarball/$STRIPPED_TAG_VERSION"
          
          echo "🔗 Downloading source archive from: $ARCHIVE_URL"
          
          # Скачиваем архив
          curl -sL \
               -H "Authorization: token $GITHUB_TOKEN" \
               -o /tmp/source_archive.tar.gz \
               "$ARCHIVE_URL"
          
          # Создаём директорию для извлечения
          mkdir -p /tmp/source_extracted
          
          # Извлекаем архив
          tar -xzf /tmp/source_archive.tar.gz -C /tmp/source_extracted --strip-components=1
          
          # Находим и копируем нужные скрипты из подкаталога scripts
          # Предположим, что структура такая: some-top-level-dir/scripts/
          # Нужно найти путь к scripts внутри архива
          SCRIPTS_DIR=$(find /tmp/source_extracted -type d -name "scripts" | head -n 1)
          
          if [ -z "$SCRIPTS_DIR" ]; then
            echo "❌ Scripts directory not found in archive"
            ls -la /tmp/source_extracted/
            exit 1
          fi
          
          echo "📁 Found scripts directory: $SCRIPTS_DIR"
          
          # Создаём директорию для подготовки к отправке на сервер
          mkdir -p /tmp/release_runner
          
          # Копируем нужные скрипты в /tmp/release_runner
          cp "$SCRIPTS_DIR/deploy-remote.sh" /tmp/release_runner/
          cp "$SCRIPTS_DIR/verify-deployment.sh" /tmp/release_runner/ # Убедись, что verify-deployment.sh там
          # Добавь другие файлы из scripts/, если нужно
          
          # Если в релизе есть другие ассеты (например, JAR-файл), скачай их отдельно
          # Или, если JAR-файл тоже в архиве (например, в target/ или build/libs/ после сборки), можно его оттуда извлечь
          
          # Пример: если trade-collector.jar в корне архива или в подкаталоге
          JAR_FILE=$(find /tmp/source_extracted -name "trade-collector.jar" -type f | head -n 1)
          if [ -n "$JAR_FILE" ]; then
              echo "📦 Found JAR file: $JAR_FILE"
              cp "$JAR_FILE" /tmp/release_runner/
          else
              echo "⚠️ JAR file not found in source archive. Downloading separately..."
              # Если JAR не в архиве, скачиваем как asset
              # Этот блок можно использовать, если JAR не включён в исходный код
              # Но если он есть в assets, можно использовать action для его скачивания:
              # - name: Download JAR
              #   uses: rwanzaigler/actions-download-release-asset@v1
              #   with:
              #     repo: ${{ github.repository }}
              #     tag: ${{ github.event.inputs.tag_version }}
              #     asset: trade-collector.jar
              #     path: /tmp/release_runner/
          fi
          
          # Проверим, что файлы действительно есть
          echo "📁 Contents of /tmp/release_runner/:"
          ls -la /tmp/release_runner/

      - name: 📤 Copy release files to server
        run: |
          # Копируем всё содержимое на сервер
          echo "📤 Copying files from runner to server..."
          scp -i ~/.ssh/vps_key -r /tmp/release_runner/* $VPS_USER@$VPS_HOST:/tmp/release/
          
          echo "✅ All files copied to server."