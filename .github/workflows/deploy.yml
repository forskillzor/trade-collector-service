name: Deploy Trade Collector
on:
  workflow_dispatch:
    inputs:
      tag_version:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

    steps:
      - name: 🔧 Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: 📥 Download release archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag_version }}"
          ARCHIVE="trade-collector-${TAG}.tar.gz"
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${ARCHIVE}"
          echo "Downloading $URL"
          curl -L -H "Authorization: token $GITHUB_TOKEN" -o "/tmp/$ARCHIVE" "$URL"

      - name: 📤 Copy to VPS and deploy
        run: |
          TAG="${{ github.event.inputs.tag_version }}"
          scp -i ~/.ssh/vps_key "/tmp/trade-collector-${TAG}.tar.gz" \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/

          ssh -i ~/.ssh/vps_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            set -e
            cd /tmp
            rm -rf trade-collector-deploy
            mkdir trade-collector-deploy
            tar -xzf trade-collector-${TAG}.tar.gz -C trade-collector-deploy
            cd trade-collector-deploy

            export DB_PASSWORD='${{ secrets.DB_PASSWORD }}'
            export DB_HOST='${{ secrets.DB_HOST || 'localhost' }}'
            export DB_PORT='${{ secrets.DB_PORT || '6432' }}'
            export DB_USER='${{ secrets.DB_USER || 'trade_user' }}'
            export DB_NAME='${{ secrets.DB_NAME || 'trade_collector' }}'

            ./deploy-remote.sh
          "