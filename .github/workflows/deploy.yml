name: Deploy Trade Collector

on:
  workflow_dispatch:
    inputs:
      tag_version:
        description: 'Версия релиза для деплоя (например: v1.0.0)'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_HOST: ${{ secrets.DB_HOST || 'localhost' }}
      DB_PORT: ${{ secrets.DB_PORT || '6432' }}
      DB_USER: ${{ secrets.DB_USER || 'trade_user' }}
      DB_NAME: ${{ secrets.DB_NAME || 'trade_collector' }}

    steps:
      - uses: actions/checkout@v4

      - name: 🔧 Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 📦 Download source code archive and send to server
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Удаляем возможные пробелы в теге
          INPUT_TAG_VERSION="${{ github.event.inputs.tag_version }}"
          STRIPPED_TAG_VERSION=$(echo "$INPUT_TAG_VERSION" | xargs)

          # URL к архиву с исходным кодом (tar.gz) - используем альтернативный URL
          ARCHIVE_URL="https://github.com/${{ github.repository }}/archive/refs/tags/$STRIPPED_TAG_VERSION.tar.gz"

          echo "🔗 Downloading source archive from: $ARCHIVE_URL"

          # Скачиваем архив
          curl -sL \
               -H "User-Agent: GitHub-Actions" \
               -f \
               -o /tmp/source_archive.tar.gz \
               "$ARCHIVE_URL"

          echo "📦 Archive downloaded. Sending to server..."

          # Копируем архив на сервер
          scp -i ~/.ssh/vps_key /tmp/source_archive.tar.gz $VPS_USER@$VPS_HOST:/tmp/

          echo "✅ Archive sent to server."

      - name: 🚀 Execute deployment and verify on server
        run: |
          ssh -i ~/.ssh/vps_key $VPS_USER@$VPS_HOST "
            cd /tmp

            # Создаём директорию для распаковки
            mkdir -p /tmp/release_extracted

            # Распаковываем архив
            tar -xzf /tmp/source_archive.tar.gz -C /tmp/release_extracted --strip-components=1

            # Проверим, что папка scripts есть
            if [ ! -d '/tmp/release_extracted/scripts' ]; then
              echo '❌ Scripts directory not found in archive'
              ls -la /tmp/release_extracted/
              exit 1
            fi

            # Копируем нужные скрипты в /tmp/release
            mkdir -p /tmp/release
            cp /tmp/release_extracted/scripts/deploy-remote.sh /tmp/release/
            cp /tmp/release_extracted/scripts/verify-deployment.sh /tmp/release/

            # Копируем JAR файл, если он есть (например, в корне или в подкаталоге)
            JAR_FILE=\$(find /tmp/release_extracted -name 'trade-collector.jar' -type f | head -n 1)
            if [ -n \"\$JAR_FILE\" ]; then
              echo \"📦 Found JAR file: \$JAR_FILE\"
              cp \"\$JAR_FILE\" /tmp/release/
            else
              echo \"⚠️ JAR file not found in archive\"
              exit 1
            fi

            # Копируем другие файлы из архива (config, service, и т.д.)
            # Пример: если config.json, run.sh и т.д. тоже в архиве
            # find /tmp/release_extracted -name 'config.json' -exec cp {} /tmp/release/ \;
            # find /tmp/release_extracted -name 'run.sh' -exec cp {} /tmp/release/ \;
            # и т.д.

            # Сделаем скрипты исполняемыми
            chmod +x /tmp/release/deploy-remote.sh
            chmod +x /tmp/release/verify-deployment.sh

            # Установим переменные окружения
            export RELEASE_TAG='${{ github.event.inputs.tag_version }}'
            export DB_PASSWORD='${{ secrets.DB_PASSWORD }}'
            export DB_HOST='${{ secrets.DB_HOST || 'localhost' }}'
            export DB_PORT='${{ secrets.DB_PORT || '5432' }}'
            export DB_USER='${{ secrets.DB_USER || 'trade_user' }}'
            export DB_NAME='${{ secrets.DB_NAME || 'trade_collector' }}'
            export VPS_HOST='$VPS_HOST'

            echo '🚀 Starting deployment of \$RELEASE_TAG...'
            /tmp/release/deploy-remote.sh

            echo '🔍 Starting verification...'
            /tmp/release/verify-deployment.sh
          "

          echo "✅ Deployment and verification completed successfully."